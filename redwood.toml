# This file contains the configuration settings for your Redwood app.
# This file is also what makes your Redwood app a Redwood app.
# If you remove it and try to run `yarn rw dev`, you'll get an error.
#
# For the full list of options, see the "App Configuration: redwood.toml" doc:
# https://redwoodjs.com/docs/app-configuration-redwood-toml

[web]
  port = 8910
  apiProxyPath = "/api"
  host = "0.0.0.0"
  title = "Treasure Chess"
  # includeEnvironmentVariables = ['']
[api]
  port = 8911
  schemaPath = "./api/db/schema.prisma"
  includeEnvironmentVariables = [
    # Ethereum
    'APP_ADMIN_WALLET_MNEMONIC',
    # Chess.com API
    'CHESS_API_URL',
    'CHESS_API_ACCESS_TOKEN',
    # General OAuth + Sessions
    'PUBLIC_REDIRECT_URL',
    'SESSION_SECRET',
    # Torus
    'TORUS_VERIFIER',
    # Chess.com OAuth
    'CHESS_OAUTH_URL',
    'CHESS_CLIENT_ID',
    'CHESS_CLIENT_SECRET',
    'CHESS_BASIC_AUTH_USERNAME',
    'CHESS_BASIC_AUTH_PASSWORD',
    # Database
    'DATABASE_URL',
    'REDWOOD_SECURE_SERVICES',
  ]
[browser]
  open = true
[experimental]
  esbuild = false
  useEnvelop = true # https://community.redwoodjs.com/t/using-graphql-envelop-helix-in-redwood-v0-35/2276
