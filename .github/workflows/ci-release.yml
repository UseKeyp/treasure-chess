#
name: CI - Release

on:
  push:
    branches: [main, staging, dev]

jobs:
  update-version:
    name: Update Version
    runs-on: ubuntu-latest
    outputs:
      IS_PRERELEASE: ${{ steps.update_version.IS_PRERELEASE }}
      VERSION: ${{ steps.update_version.VERSION }}
      SKIP_RELEASE: ${{ steps.skip_release.SKIP_RELEASE }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Use Node.js 12.x
        uses: actions/setup-node@v1
        with:
          node-version: 12.x
          registry-url: https://registry.npmjs.org/

      - name: Update version
        id: update_version
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
        run: |
          IS_PRERELEASE=true
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          if [ ${{ github.ref_name }} == "main" ] ; then
             npx lerna version --conventional-graduate --conventional-commits --yes
             IS_PRERELEASE=false
          else
             npx lerna version prerelease --yes --preid staging
          fi
          VERSION=v$(jq -r .version lerna.json)
          echo "::set-output name=VERSION::$VERSION"
          echo "::set-output name=IS_PRERELEASE::$IS_PRERELEASE"

      - name: Skip release
        id: skip_release
        run: |
          SKIP_RELEASE=0
          if grep -q '^v[0-9]' <<< "${{ github.event.head_commit.message }}" ; then
            SKIP_RELEASE=1
          elif github.event_name == 'pull_request' ; then
            SKIP_RELEASE=1
          elif ! grep -q 'staging\|main' <<< "${{ github.ref_name }}" ; then
            SKIP_RELEASE=1
          fi
          echo SKIP_RELEASE: $SKIP_RELEASE
          echo "::set-output name=SKIP_RELEASE::$SKIP_RELEASE"

  build:
    name: Build and Push Images
    needs: update-version
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Earthly
        uses: ./.github/actions/setup_earthly

      - name: Login to container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: earthly --ci --push -P --VERSION=${{ needs.update-version.outputs.VERSION }} +docker

  create-release-draft:
    name: Create Release Draft
    needs: [update-version, build]
    if: needs.update-version.outputs.SKIP_RELEASE == 0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - name: Create release draft
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ steps.update_version.outputs.IS_PRERELEASE }}
          release_name: ${{ steps.update_version.outputs.VERSION }}
          tag_name: ${{ steps.update_version.outputs.VERSION }}
          body: |
            Changes in this Release
            ## Changed
            ## Added
            ## Fixes
            ## Breaking

      - name: Discord notify release draft
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVOPS }}
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        with:
          args: 🗒️ Draft Release created for `${{ steps.update_version.outputs.VERSION }}` ${{ steps.create_release.outputs.html_url }}
