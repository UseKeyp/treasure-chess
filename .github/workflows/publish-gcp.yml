name: 'GCP Publish Docker'
on:
  workflow_dispatch:
    inputs:
      image_tag_prefix:
        description: 'Image Tag Prefix (prod or staging)'
        required: true
        default: 'staging'
env:
  NODE_ENV: ${{ github.event.inputs.image_tag_prefix }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_BRANCH: ${{ github.ref }}
  GITHUB_REPOSIOTORY: ${{ github.repository }}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v0
        with:
          version: '330.0.0'
          service_account_key: ${{ secrets.GCP_SA_KEY }}
      - name: Configure docker auth
        run: gcloud auth configure-docker us-east4-docker.pkg.dev
      - name: Build and push image
        run: |
          PREFIX=$NODE_ENV
          REDWOOD_API_URL="https://treasure.gcp-staging.chess-platform.com"
          APP_DOMAIN="https://treasure.gcp-staging.chess-platform.com"
          ETHEREUM_NETWORK_NAME=matic
          BASIC_AUTH_PASSWORD=pauliemorphy
          SENTRY_ENVIRONMENT=staging
          if [ $PREFIX == "prod" ] ; then
             REDWOOD_API_URL="https://treasure.chess.com"
             APP_DOMAIN="https://treasure.chess.com"
             SENTRY_ENVIRONMENT="prod"
          fi
          IMAGE_TAG=$PREFIX-$(echo $GITHUB_SHA | cut -c 1-7)
          IMAGE_NAME=$(echo $GITHUB_REPOSIOTORY | cut -c 12-)
          COMPONENTS="api web"
          PROJECT_NAME=us-east4-docker.pkg.dev/chess-gcr1/treasure-chess
          for COMPONENT in $COMPONENTS
          do

              echo "branch: $GITHUB_BRANCH, building image... $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:$IMAGE_TAG"
              echo "$GCP_SA_KEY" | base64 -d > ./credentials.json
              docker build -t $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:$IMAGE_TAG \
                --build-arg NODE_ENV=$NODE_ENV \
                --build-arg REDWOOD_API_URL=$REDWOOD_API_URL \
                --build-arg APP_DOMAIN=$APP_DOMAIN \
                --build-arg ETHEREUM_NETWORK_NAME=$ETHEREUM_NETWORK_NAME \
                --build-arg BASIC_AUTH_PASSWORD=$BASIC_AUTH_PASSWORD \
                --build-arg SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT \
                 -f ./$COMPONENT/Dockerfile .

              echo "pushing image... $PROJECT_NAME/$IMAGE_NAME:$IMAGE_TAG"
              docker push $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:$IMAGE_TAG

              if [ $PREFIX == "prod" ] ; then
                 echo "pushing image... $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:latest"
                 docker tag $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:$IMAGE_TAG $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:latest
                 docker push $PROJECT_NAME/$IMAGE_NAME-$COMPONENT:latest
              fi
          done
      - name: Set output
        id: vars
        run: |
          echo ::set-output name=short_ref::${GITHUB_REF#refs/*/}
          echo ::set-output name=short_sha::$(echo ${GITHUB_SHA} | cut -c1-7)
      - name: Discord notification
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVOPS }}
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        with:
          args: |
            🚢 New Release 🚢

            **${{ env.NODE_ENV }}-${{ steps.vars.outputs.short_sha }}**

            Branch: `${{ steps.vars.outputs.short_ref }}`
            Image: `$PROJECT_NAME/$IMAGE_NAME-$COMPONENT:$IMAGE_TAG`
