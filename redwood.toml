# This file contains the configuration settings for your Redwood app.
# This file is also what makes your Redwood app a Redwood app.
# If you remove it and try to run `yarn rw dev`, you'll get an error.
#
# For the full list of options, see the "App Configuration: redwood.toml" doc:
# https://redwoodjs.com/docs/app-configuration-redwood-toml

[web]
  port = 8910
  host = "0.0.0.0"
  title = "Treasure Chess"
  apiProxyPort = 8911
  apiUrl = "/api"
  # includeEnvironmentVariables = ['']
[api]
  port = 8911
  schemaPath = "./api/db/schema.prisma"
  includeEnvironmentVariables = [
    # Ethereum
    'APP_ADMIN_WALLET_ADDRESS',
    'APP_ADMIN_WALLET_MNEMONIC',
    'CONTRACT_ADDRESS_TREASURE',
    'CONTRACT_ADDRESS_TREASURE_MARKET',
    'ETHEREUM_NETWORK_NAME',
    'PINATA_API_KEY',
    'PINATA_API_SECRET_KEY',
    'TOKEN_URI_DOMAIN',
    # Sentry.io
    'SENTRY_DSN',
    # Discord
    'DISCORD_BOT_TOKEN',
    # Wyre
    'WYRE_API_KEY',
    'WYRE_SECRET_KEY',
    'WYRE_ACCOUNT_ID_TREASURE',
    'WYRE_MINT_USD_SOURCE_AMOUNT',
    'WYRE_MINT_USD_PURCHASE_AMOUNT',
    # Chess.com API
    'CHESS_API_URL',
    'CHESS_API_ACCESS_TOKEN',
    # General OAuth + Sessions
    'PUBLIC_REDIRECT_URL',
    'SESSION_SECRET',
    # Torus
    'TORUS_VERIFIER',
    # Chess.com OAuth
    'CHESS_OAUTH_URL',
    'CHESS_CLIENT_ID',
    'CHESS_CLIENT_SECRET',
    'CHESS_BASIC_AUTH_USERNAME',
    'CHESS_BASIC_AUTH_PASSWORD',
    # Database
    'DATABASE_URL',
    'REDWOOD_SECURE_SERVICES',
  ]
[browser]
  open = true
[experimental]
  esbuild = false
  useEnvelop = true # https://community.redwoodjs.com/t/using-graphql-envelop-helix-in-redwood-v0-35/2276
[build]
# Note: This isn't being run, maybe need to delete
  command = "cd packages/treasure-html; yarn build && yarn rw build"
