name: Repo sync w/ @treasure-chess

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: git-sync-main
      - uses: actions/checkout@v2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          tasks/clean-and-sync-repo.sh
