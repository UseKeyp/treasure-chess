name: Repo sync w/ @treasure-chess

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: git-sync-main
        uses: wei/git-sync@v3
        with:
          source_repo: 'git@github.com:pi0neerpat/treasure-chess-app.git'
          source_branch: 'main'
          destination_repo: 'git@github.com:treasure-chess/treasure-chess-app.git'
          destination_branch: 'main'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
